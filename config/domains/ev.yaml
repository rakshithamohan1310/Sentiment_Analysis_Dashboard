# ── QUALITY FILTER ────────────────────────────────────────────────────────────
quality:
  min_text_length: 20
  min_relevance_score: 0.0
  spam_patterns:
    - "\\bclick here\\b"
    - "\\bvisit our website\\b"
    - "\\bfree.*?trial\\b"
    - "\\bdiscount code\\b"
    - "\\baffiliate link\\b"
    - "\\bsponsored post\\b"
    - "^\\[deleted\\]$"
    - "^\\[removed\\]$"

# ── REDDIT settings ───────────────────────────────────────────────────────────
